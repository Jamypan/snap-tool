<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>录制中 · 悬浮控制条</title>
<link rel="stylesheet" href="_style.css">
</head>
<body class="scene">
<div class="desk"></div>

<div class="frame">
  <div class="stage">
    <div class="fwin" style="left:38px;top:34px;width:330px;height:230px;">
      <div class="fbar"><i class="r"></i><i class="y"></i><i class="g"></i><span>浏览器</span></div>
      <div class="fbody"><div class="block"></div><div class="ln w2"></div><div class="ln w1"></div><div class="ln w3"></div></div>
    </div>
    <div class="fwin" style="left:560px;top:70px;width:320px;height:250px;">
      <div class="fbar"><i class="r"></i><i class="y"></i><i class="g"></i><span>文档</span></div>
      <div class="fbody"><div class="ln w2"></div><div class="ln w1"></div><div class="ln w2"></div><div class="ln w3"></div><div class="ln w1"></div></div>
    </div>
    <div class="fwin" style="left:120px;top:330px;width:360px;height:150px;">
      <div class="fbar"><i class="r"></i><i class="y"></i><i class="g"></i><span>文件夹</span></div>
      <div class="fbody"><div class="ln w1"></div><div class="ln w2"></div><div class="ln w3"></div></div>
    </div>

    <div class="taskbar">
      <div class="tbstart"></div><div class="tbico"></div><div class="tbico a"></div><div class="tbico"></div>
      <div class="tbclock">21:07</div>
    </div>

    <!-- 全屏红框（框选/全屏共用） -->
    <div class="screen-border"></div>

    <!-- 录制中悬浮控制条 -->
    <div class="minibar">
      <div class="rdot"></div>
      <div class="timer">00:12</div>
      <div class="sep"></div>
      <div class="lvl"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="lbl">系统声 · 麦克风</div>
      <div class="sep"></div>
      <div class="mbbtn" title="暂停">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </div>
      <div class="mbbtn stop" title="停止">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </div>
      <div class="esc">F9 停止</div>
    </div>
  </div>
  <div class="tag">录制中 · 主界面自动隐藏，只在屏幕角落留悬浮控制条 · 可随时暂停 / 停止</div>
</div>
</body>
</html>
