<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>E-01 桌面常态</title>
<link rel="stylesheet" href="_style.css"></head>
<body>
<div class="desk">

  <div class="fakewin" style="position:absolute;left:64px;top:72px;width:640px;height:430px">
    <div class="fw-bar">
      <i></i><i></i><i></i><div class="fw-url"></div>
    </div>
    <div class="fw-body" style="height:398px">

        <b>目录</b>
        <span class="cur" style="width:86%"></span>
        <span style="width:72%"></span>
        <span style="width:80%"></span>
        <span style="width:64%"></span>
        <span style="width:76%"></span>
        <span style="width:58%"></span>
      </div>
      <div class="fw-main">
        <h3>2026 年第三季度项目复盘</h3>
        <div class="meta">更新于 11 月 18 日 · 共 12 页</div>

        <div class="ln w92" style="margin-top:12px"></div>
        <div class="ln w80"></div>
        <div class="ln w64"></div>
        <div class="fw-table">
          <div class="tr"><div class="td th">模块</div><div class="td th">完成度</div><div class="td th">备注</div></div>

          <div class="tr"><div class="td">取字</div><div class="td">88%</div><div class="td">跨行选择</div></div>
        </div>
        <div class="ln w80" style="margin-top:16px"></div>
        <div class="ln w64"></div>
      </div>
    </div>
  </div>

  <div class="fakewin" style="position:absolute;left:748px;top:132px;width:452px;height:340px">
    <div class="fw-bar"><i></i><i></i><i></i><div class="fw-url"></div></div>
    <div class="fw-body" style="height:308px">
      <div class="fw-main" style="padding:20px 24px">
        <h3 style="font-size:15px">待办清单</h3>
        <div class="meta">今天 4 项 · 已完成 1</div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
          <span style="width:13px;height:13px;border-radius:4px;background:#17a97b;flex:0 0 auto"></span>
          <span class="ln" style="margin:0;flex:1;width:auto"></span>
        </div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
          <span style="width:13px;height:13px;border-radius:4px;border:1.5px solid #d9d2c7;flex:0 0 auto"></span>
          <span class="ln" style="margin:0;flex:1;width:auto"></span>
        </div>
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
          <span style="width:13px;height:13px;border-radius:4px;border:1.5px solid #d9d2c7;flex:0 0 auto"></span>
          <span class="ln" style="margin:0;flex:1;width:auto"></span>
        </div>
        <div class="ln w80" style="margin-top:18px"></div>
        <div class="ln w64"></div>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <i></i><i></i><i class="on"></i><i></i><i></i>
  </div>

  <!-- 悬浮条：常态，收起 -->
  <div class="minibar" style="left:50%;transform:translateX(-50%);bottom:70px">
    <div class="mb-logo"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h3l2-2h2l2 2h3a2 2 0 0 1 2 2v2"/><circle cx="12" cy="13" r="4"/><path d="M6 18h12"/></svg></div>
    <div class="mbv"></div>
    <div class="mb on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="4 3"/></svg></div>
    <div class="mb"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></div>
    <div class="mb"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
    <div class="mbv"></div>
    <div class="mb"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="13" rx="2"/><path d="M12 18v3"/><path d="M9 19.5l3 2.5 3-2.5"/></svg></div>
    <div class="mb"><svg viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 4 3H6l4-3z"/></svg></div>

    <span class="mb-key"><b>Ctrl+Shift+A</b></span>
    <div class="mb"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg></div>
  </div>

</div>
